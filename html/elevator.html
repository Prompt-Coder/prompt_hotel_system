<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hotel elevator</title>
<link rel="stylesheet" href="elevator.css" />
</head>
<body>
  <div id="panel" class="hidden">
    <header>
      <div class="title">
        <span class="mark"></span>
        <div>
          <h1>Elevator</h1>
          <p id="here">Lobby</p>
        </div>
      </div>
      <div id="roomTag" class="room-tag hidden">
        <span class="label">Your room</span>
        <span id="roomNum" class="num">—</span>
      </div>
    </header>

    <ul id="stops"></ul>

    <footer>
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> select</span>
      <span><kbd>Enter</kbd> go</span>
      <span><kbd>Esc</kbd> close</span>
    </footer>
  </div>
<script src="elevator.js"></script>
</body>
</html>
